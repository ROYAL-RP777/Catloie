<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Carlo's Upgrader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1014;--pn:#181b21;--pn2:#21252d;--ac:#ffd60a;--tx:#f2f3f5;--mu:#8a909b;--ok:#7bd83a;--bad:#ff4d3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Oxanium,system-ui,sans-serif;max-width:560px;margin:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0}
header{display:flex;align-items:center;gap:10px;padding:12px;background:#12151a;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:17px;color:var(--ac);line-height:1}.logo small{display:block;color:var(--mu);font-size:11px;font-weight:500}
.on{font-size:14px;color:var(--ac);margin-right:auto}
.bal{display:flex;border:1px solid #4a3f10;border-radius:12px;overflow:hidden;background:#15130a}
.bal span{padding:8px 12px;font-weight:700}.bal button{background:var(--ac);color:#111;padding:0 12px;font-weight:800}
.demo{background:#2a2108;color:var(--ac);text-align:center;font-size:12px;padding:5px}
.drops{display:flex;gap:8px;overflow-x:auto;padding:12px}
.dr{flex:0 0 108px;border-radius:12px;background:#241a3f;border:1px solid #4b3a8a;padding:6px;text-align:center;font-size:11px}
.dr img,.dr .ph{height:48px;width:100%;object-fit:contain;border-radius:8px;background:#dfe3e8}
.dr b{display:block;color:var(--ac);margin-top:3px}
h1{text-align:center;font-size:22px;margin:8px 0 0}
.wheel{position:relative;width:min(300px,80vw);margin:6px auto}
.wheel svg{width:100%;display:block}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ctr b{font-size:38px;color:var(--ok)}.ctr span{color:var(--ok)}
#ptr{transform-origin:150px 150px;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.box{background:var(--pn);border-radius:14px;min-height:150px;padding:10px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.box img{width:100%;max-height:70px;object-fit:contain;background:#dfe3e8;border-radius:8px}
.box small{color:var(--mu)}
.up{display:block;width:calc(100% - 24px);margin:12px;padding:15px;border-radius:12px;background:var(--ac);color:#111;font-weight:800;font-size:18px}
.up:disabled{opacity:.4}
.tabs{display:flex;background:var(--pn);margin:0 12px;border-radius:14px 14px 0 0}
.tabs button{flex:1;padding:14px;background:none;color:var(--mu);font-weight:700}.tabs .a{color:var(--tx)}
.sub{display:flex;background:var(--pn);margin:0 12px;padding:8px;gap:6px}
.sub button{flex:1;padding:11px;border-radius:12px;background:none;color:var(--mu);font-weight:700}.sub .a{background:var(--ac);color:#111}
.flt{display:flex;gap:6px;background:var(--pn);margin:0 12px;padding:0 8px 10px}
.flt input,.flt select{flex:1;min-width:0;background:var(--pn2);border:1px solid #333;border-radius:10px;color:var(--tx);padding:10px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--pn);margin:0 12px;padding:8px;border-radius:0 0 14px 14px;min-height:120px}
.it{position:relative;border-radius:12px;padding:6px;background:var(--pn2);border:2px solid transparent;text-align:center;font-size:11px;cursor:pointer}
.it img,.it .ph{height:56px;width:100%;object-fit:contain;border-radius:8px;background:#dfe3e8;display:flex;align-items:center;justify-content:center;color:#222;font-weight:800;font-size:12px}
.it .p{color:var(--ac);font-weight:800;font-size:13px;text-align:right}
.it .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .w{color:var(--mu)}
.it.s{border-color:var(--ac)}.it.t{border-color:var(--ok)}
.it .st{position:absolute;left:4px;top:4px;background:#0009;border-radius:8px;padding:0 5px;color:var(--ac)}
.sell{background:#3a1a16;color:#ff8b7d;border-radius:8px;padding:3px 6px;margin-top:3px;font-size:11px;width:100%}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:30px 10px}
.hint{width:100%;margin-top:6px;background:none;border:1px solid var(--ac);color:var(--ac);border-radius:10px;padding:7px;font-weight:700;font-size:12px}
.mod{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20}
.mod.o{display:flex}.card{background:var(--pn);border-radius:16px;padding:20px;width:min(340px,90vw);text-align:center}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.amts button{padding:12px;border-radius:10px;background:var(--pn2);font-weight:700}
.card input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:var(--pn2);color:var(--tx);font:inherit;margin-bottom:10px}
.xs{display:flex;gap:6px;padding:0 12px;overflow-x:auto}.xs button{flex:1;padding:9px 12px;border-radius:10px;background:var(--pn2);font-weight:800;color:var(--mu)}.xs .a{background:var(--ac);color:#111}
.res{font-size:20px;font-weight:800;min-height:28px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;z-index:30;pointer-events:none}
.toast.o{opacity:1}
footer{text-align:center;color:var(--mu);font-size:11px;padding:20px}
</style></head><body>
<header><div class="logo">Carlo's<small>upgrader</small></div><div class="on">👥 <span id="on">2 909</span></div>
<div class="bal"><span id="bal">0.00</span><button onclick="openTop()">+ Top up</button></div></header>
<div class="demo">Demo only. All skins and money are virtual and have no real value.</div>
<div class="drops" id="drops"></div>
<h1>UPGRADER</h1>
<div class="wheel"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="130" fill="none" stroke="#1d2027" stroke-width="3"/>
<circle cx="150" cy="150" r="108" fill="#14161b" stroke="#23262e" stroke-width="22"/>
<circle id="arc" cx="150" cy="150" r="108" fill="none" stroke="url(#g)" stroke-width="22" stroke-dasharray="0 999" transform="rotate(-90 150 150)"/>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff6a2b"/></linearGradient></defs>
<g id="ptr"><polygon points="150,14 142,40 158,40" fill="#ffd60a"/></g></svg>
<div class="ctr"><b id="ch">0.00%</b><span id="chl">pick skins</span></div></div>
<div class="xs" id="xs"><button data-x="1.5" onclick="mx(1.5)">x1.5</button><button data-x="2" onclick="mx(2)">x2</button><button data-x="5" onclick="mx(5)">x5</button><button data-x="10" onclick="mx(10)">x10</button><button data-x="25" onclick="mx(25)">x25</button><button data-x="100" onclick="mx(100)">x100</button></div>
<div class="res" id="res"></div>
<div class="two"><div class="box" id="from"></div><div class="box" id="to"></div></div>
<button class="up" id="go" onclick="spin()" disabled>Upgrade</button>
<div class="tabs"><button id="t1" class="a" onclick="setTab(1)">My items</button><button id="t2" onclick="setTab(2)">Desired items</button></div>
<div class="sub" id="sub"><button id="s1" class="a" onclick="setSub(1)">My skins</button><button id="s2" onclick="setSub(2)">Shop</button></div>
<div class="flt" id="flt"><select id="sort" onchange="draw()"><option value="1">Price ↑</option><option value="-1">Price ↓</option></select><input id="mn" type="number" placeholder="from" oninput="draw()"><input id="mx" type="number" placeholder="to" oninput="draw()"></div>
<div class="grid" id="grid"></div>
<footer>Carlo's Upgrader · virtual entertainment demo</footer>
<div class="mod" id="mod" onclick="if(event.target===this)closeTop()"><div class="card"><h2 style="margin:0 0 4px">Top up balance</h2><small style="color:var(--mu)">Virtual money, no real payment</small>
<div class="amts"><button onclick="addB(5)">5</button><button onclick="addB(10)">10</button><button onclick="addB(25)">25</button><button onclick="addB(100)">100</button><button onclick="addB(500)">500</button><button onclick="addB(5000)">5000</button></div>
<input id="cu" type="number" placeholder="Custom amount"><button class="up" style="margin:0;width:100%" onclick="addB(+cu.value)">Top up</button><button class="sell" style="margin-top:10px;padding:10px" onclick="closeTop()">Close</button></div></div>
<div class="toast" id="toast"></div>
